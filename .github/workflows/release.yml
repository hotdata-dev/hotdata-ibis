name: GitHub Release

on:
  push:
    tags:
      - 'v[0-9]*'
  # Retry an existing tag without moving it. A publish can fail for reasons that
  # have nothing to do with the code -- a stale action pin, a PyPI outage -- and
  # with only the tag trigger the choices were to delete and re-push the tag or
  # to burn a version number on a CI fix.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to act on (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  # The tag being released, however this run was triggered.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Read package metadata
        id: meta
        run: |
          pkg_name=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])")
          pkg_version="${RELEASE_TAG#v}"
          echo "name=${pkg_name}" >> "$GITHUB_OUTPUT"
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        id: notes
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ -f CHANGELOG.md ]]; then
            body="$(python scripts/extract-changelog.py "$version")"
          else
            body="Release ${version}."
          fi
          delimiter="EOF_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delimiter}"
            echo "$body"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          # GitHub decides by tag date/semver rather than run order. `true` would
          # move the badge when a dispatch repairs an older tag; `false` is not
          # "leave alone" -- it marks a release explicitly NOT latest, demoting the
          # newest tag in the case this trigger mostly serves.
          make_latest: legacy
