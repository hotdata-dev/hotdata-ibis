[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibis-hotdata"
version = "0.1.0"
description = "Ibis backend for Hotdata federated SQL API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hotdata Ibis contributors" }]
keywords = ["ibis", "hotdata", "sql", "dataframe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ibis-framework>=10.0,<11",
  "hotdata>=0.1.0",
  "httpx>=0.27",
  "pyarrow>=15",
  "pyarrow-hotfix>=0.6",
  "pandas>=2",
  "sqlglot>=24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1",
    "ruff>=0.5",
]

[project.urls]
Documentation = "https://www.hotdata.dev/docs/api-reference"
"Ibis" = "https://ibis-project.org/"

[project.entry-points."ibis.backends"]
hotdata = "ibis_hotdata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"examples/**/*.py" = ["E402"]
